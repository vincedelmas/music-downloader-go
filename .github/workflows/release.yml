name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: please
  build:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev xvfb
      - name: Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Test
        shell: bash
        run: go test -tags ci ./...
      - name: Collect dependency licenses
        shell: bash
        run: |
          go install github.com/google/go-licenses/v2@latest
          go-licenses save . --save_path build/go-licenses --ignore music-downloader-go
      - name: Build bundled package
        shell: bash
        run: go run ./cmd/bundle --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Upload packages and checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./* --clobber
